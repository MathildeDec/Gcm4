name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  quality:
    name: Qualité (lint, tests, catalogues .po)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install

      - name: Installation des dépendances (groupe dev)
        run: uv sync

      - name: gettext (validation des catalogues .po)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Lint (flake8 gnome_connection_manager.py)
        # Réintégré par l'issue #113 : flake8 est vert sur ce fichier.
        run: uv run --with flake8 flake8 gnome_connection_manager.py

      - name: Format (ruff format --check)
        # Parité NetCross : le job Qualité contrôle aussi le format.
        # Les 26 fichiers historiquement non formatés ont été alignés
        # (cf. issue de format) ; ce verrou empêche toute régression.
        run: uv run ruff format --check .

      - name: Tests (pytest + couverture)
        # Toute la suite, y compris tests/test_gcm.py (réintégré, issue #112 :
        # stubs gi complétés et tests resynchronisés avec plugins/).
        # Couverture (issue #128) : périmètre et seuil bloquant (fail_under)
        # lus dans [tool.coverage.*] de pyproject.toml. L'étape échoue si la
        # couverture totale passe sous le seuil.
        run: >-
          uv run python -m pytest tests/ -q
          --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Publication du rapport de couverture (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

      - name: Catalogues de traduction (.po)
        # Même validation que `make validate` : msgfmt --check sur les
        # 29 langues de lang/ (tools/validate_po.py).
        run: uv run python tools/validate_po.py lang/*.po
